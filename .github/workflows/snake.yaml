name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate snake graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: IVANNNGG
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff007f&color_dots=#ebedf0,#ffb3ba,#ffdfba,#baffc9,#bae1ff
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff007f&color_dots=#0d1117,#ff00ff,#00ffff,#00ff00,#ffff00

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
