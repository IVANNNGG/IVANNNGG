name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate snake graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: IVANNNGG
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#4b0082&color_dots=#ebedf0,#d8b4e2,#c48ed4,#a35cba,#7a2799
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#d873ff&color_dots=#0d1117,#3d1a54,#5a217e,#7e2ea8,#a23ad9

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
